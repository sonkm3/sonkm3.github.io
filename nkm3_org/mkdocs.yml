site_name: nkm3.org
site_url: https://nkm3.org/
copyright: Copyright &copy; 2025 -  so nkmr
plugins:
    - search
    - mkdocs-jupyter:
          include: ["*.ipynb"] # Default: ["*.py", "*.ipynb"]
          ignore: ["some-irrelevant-files/*.ipynb"]
    - blog
theme:
    name: material
    palette:
        primary: light green
        accent: teal
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra:
    consent:
        title: Cookie consent
        description: >- 
            We use cookies to recognize your repeated visits and preferences, as well
            as to measure the effectiveness of our documentation and whether users
            find what they're searching for. With your consent, you're helping us to
            make our documentation better.
    analytics:
        provider: google
        property: UA-1928342-2
    social:
        - icon: fontawesome/brands/lastfm
          link: https://www.last.fm/user/sonkm3
        - icon: fontawesome/brands/instagram
          link: https://instagram.com/sonkm3
        - icon: fontawesome/brands/github
          link: https://github.com/sonkm3
nav:
  - index.md
  - Blog:
    - blog/index.md
